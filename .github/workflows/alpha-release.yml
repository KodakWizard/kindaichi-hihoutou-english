name: Publish Windows editor and BPS alpha

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/alpha-release.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Build Windows editor
        shell: pwsh
        run: |
          python -c "import gzip; from pathlib import Path; Path('english-catalogue.json').write_bytes(gzip.decompress(Path('editor/english-catalogue.json.gz').read_bytes()))"
          New-Item -ItemType Directory -Path build -Force | Out-Null
          python tools/package_translation_editor.py --catalogue english-catalogue.json
      - name: Publish alpha prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0-alpha --target "$env:GITHUB_SHA" --prerelease --title "Kindaichi English v0.1.0-alpha" --notes-file RELEASE_NOTES.md patches/Kindaichi_Hihoutou_English_v0.1.0-alpha.bps build/Kindaichi-English-Editor-v0.1.0-alpha.zip
